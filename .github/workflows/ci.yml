name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces its older run; every commit on main keeps a complete run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Sigyll.slnx

      # Any package, direct or transitive, with a published advisory fails the build.
      - name: Refuse vulnerable packages
        run: |
          dotnet list Sigyll.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found; update them before merging."
            exit 1
          fi

      - name: Build
        run: dotnet build Sigyll.slnx --no-restore -c Release

      # A SoftHSM token store for the PKCS #11 signing tests; without it they skip.
      - name: Install SoftHSM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq softhsm2
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\nlog.level = ERROR\n' \
            "$RUNNER_TEMP/softhsm/tokens" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          echo "SOFTHSM2_CONF=$RUNNER_TEMP/softhsm/softhsm2.conf" >> "$GITHUB_ENV"
          echo "SIGYLL_TEST_PKCS11_LIB=/usr/lib/softhsm/libsofthsm2.so" >> "$GITHUB_ENV"

      - name: Test
        run: |
          dotnet test _tests/Sigyll.Signing.Tests --no-build -c Release --logger "trx;LogFileName=signing.trx" --results-directory test-results
          dotnet test _tests/Sigyll.Auth.Tests --no-build -c Release --logger "trx;LogFileName=auth.trx" --results-directory test-results
          dotnet test _tests/Sigyll.Integration.Tests --no-build -c Release --logger "trx;LogFileName=integration.trx" --results-directory test-results
          dotnet test _tests/Sigyll.Portal.Integration.Tests --no-build -c Release --logger "trx;LogFileName=portal-integration.trx" --results-directory test-results

      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore Sigyll.slnx

      # One CycloneDX BOM per deployable application, listing every package it ships with.
      - name: Generate CycloneDX BOMs
        run: |
          for app in Sigyll Sigyll.Portal Sigyll.Certificate.Server; do
            dotnet dotnet-CycloneDX "$app/$app.csproj" -o sbom -F Json -fn "$app.cdx.json"
          done

      # Sigyll is used commercially: every shipped package needs a permissive licence (tools/licence-check).
      - name: Refuse packages without a permissive licence
        run: python3 tools/licence-check/check_licences.py sbom/*.cdx.json

      # The licences and notices of every package the applications ship with, taken from what each one
      # publishes (tools/third-party-notices). Fails when a package's licence text can't be found.
      - name: Write the third-party notices
        run: |
          inputs=""
          for app in Sigyll Sigyll.Portal Sigyll.Certificate.Server; do
            dotnet publish "$app/$app.csproj" -c Release -o "publish/$app" -nologo
            inputs="$inputs publish/$app/$app.deps.json"
          done
          dotnet run tools/third-party-notices/ThirdPartyNotices.cs -- sbom/THIRD-PARTY-NOTICES.txt \
            $inputs tools/third-party-notices/vendored/bootstrap.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom

  container:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Sigyll image
        run: docker build -f Sigyll/Dockerfile -t sigyll:ci .

      - name: Refuse running as root
        run: |
          user=$(docker image inspect sigyll:ci --format '{{.Config.User}}')
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::The Sigyll image runs as root."
            exit 1
          fi

      - name: Refuse an image without its licence and third-party notices
        run: docker run --rm --entrypoint sh sigyll:ci -c 'test -s /app/LICENSE && test -s /app/THIRD-PARTY-NOTICES.txt'

      # Anchore's scan action downloads and runs the Grype scanner against the image (operating-system
      # packages, OpenSSL, the .NET runtime and the app's own packages). High or critical vulnerabilities that
      # already have a fix fail the build.
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: sigyll:ci
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
