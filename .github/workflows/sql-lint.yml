name: SQL style

on:
  pull_request:
    paths:
      - "dist/AlloyDB/**"
      - "tools/sql-lint/**"
  push:
    branches: [main]
    paths:
      - "dist/AlloyDB/**"
      - "tools/sql-lint/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Flyway SQL style (uppercase DDL, lowercase identifiers, comments on every column)
        run: python tools/sql-lint/check_sql.py dist/AlloyDB
