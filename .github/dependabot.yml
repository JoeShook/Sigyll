# Weekly update checks for NuGet packages, the GitHub Actions the workflows pin by commit,
# and the container base images.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      aspire:
        patterns: ["Aspire.*"]
      microsoft:
        patterns: ["Microsoft.*", "System.*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/Sigyll"
    schedule:
      interval: "weekly"
