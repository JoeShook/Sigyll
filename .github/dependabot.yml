# Weekly update checks for NuGet packages, the GitHub Actions the workflows pin by commit,
# and the container base images.
#
# NuGet packages and Actions wait 3 days after a release before Dependabot proposes it, so a hijacked or broken
# release has time to be found and pulled first. Security updates are not held back. Base image digests are not
# held either: Microsoft rebuilds them mainly to ship OS security fixes.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      aspire:
        patterns: ["Aspire.*"]
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
    ignore:
      # Fluent UI 5 rewrote the component API (FluentSelect, theme modes, bindings); moving to it is a UI
      # migration of its own, not a dependency bump. Minor and patch releases of 4.x still come through.
      - dependency-name: "Microsoft.FluentUI.AspNetCore.Components*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      # init and analyze are two halves of one action and only work at the same version.
      codeql:
        patterns: ["github/codeql-action*"]

  - package-ecosystem: "docker"
    directory: "/Sigyll"
    schedule:
      interval: "weekly"
    ignore:
      # The base images follow the .NET version the projects target. A new major version is a framework
      # upgrade, made in the project files and Dockerfiles together, not an image bump.
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
